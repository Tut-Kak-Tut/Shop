<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FurniShop</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/static/index.html" class="navbar-brand">FurniShop</a>
  </div>
</nav>

<main class="auth-page">
  <div class="auth-box">
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Create Account</button>
      </div>

      <div id="auth-alert"></div>

      <!-- Login form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <!-- Register form -->
      <form id="register-form" style="display:none">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem">
          <div class="form-group">
            <label for="reg-first-name">First name</label>
            <input type="text" id="reg-first-name" class="form-control" placeholder="John" autocomplete="given-name">
          </div>
          <div class="form-group">
            <label for="reg-last-name">Last name</label>
            <input type="text" id="reg-last-name" class="form-control" placeholder="Doe" autocomplete="family-name">
          </div>
        </div>
        <div class="form-group">
          <label for="reg-email">Email address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-password">Password <small style="font-weight:400">(min. 8 characters)</small></label>
          <input type="password" id="reg-password" class="form-control" placeholder="Create a password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>
    </div>
  </div>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
